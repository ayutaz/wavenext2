# =============================================================================
# GAN-WaveNeXt 2 smoke 設定 (T-M2.6) — 本番 (gan_wavenext2.yaml) と明確に分離。
# 1 utterance × 1000 step overfit (実 LibriTTS-R, GPU)。max_steps/batch/validation が本番と異なる。
# synthetic CPU smoke (scripts/smoke_gan_synthetic.py) はこの config を使わず内部最小設定で動く。
# =============================================================================
seed: 42
model:
  type: gan_wavenext2
  T: 4
  sub_model:
    n_mels: 128
    hop: 300
    n_fft: 2048
    win_length: 1200
discriminator:
  type: msd_only
  num_D: 3
  ndf: 16
  n_layers: 4
  downsampling_factor: 4
loss:
  mrstft:
    n_ffts: [512, 1024, 2048]
    win_lengths: [360, 900, 1800]
    hop_sizes: [80, 150, 300]
    eps: 1.0e-5
  weights:
    d_gan: 1.0
    d_fm: 10.0
    mrstft_sc: 2.5
    mrstft_mag: 2.5
train:
  max_steps: 1000               # smoke は 1000 step (本番は 2M)
  batch_size: 1                 # 1 sample overfit
  segment_length: 16384
  num_workers: 0
  grad_clip_norm: 1.0
  optimizer:
    type: AdamW
    lr_g: 1.0e-4
    lr_d: 2.0e-4
    betas: [0.8, 0.99]
    weight_decay: 1.0e-3
  scheduler:
    type: InverseLR
    inv_gamma: 200000
    power: 0.5
    warmup: 0.999
validation:
  interval_steps: 100000        # smoke では実質 off (max_steps 未満で発火しない)
  num_utterances: 1
  metric: mrstft_total
checkpoint:
  dir: checkpoints/smoke_gan
  interval_steps: 100000        # 実質 off
  keep_last_n: 1
logging:
  tensorboard_dir: logs/smoke_gan
  scalar_interval_steps: 10
data:
  root_dir: /path/to/LibriTTS-R
  train_filelist: filelists/train.tsv
  val_filelist: filelists/val.tsv
  smoke_idx: 0                  # deterministic に 0 番目の utterance を overfit
  mel:
    sample_rate: 24000
    n_fft: 2048
    win_length: 1200
    n_mels: 128
    f_min: 20
    f_max: 12000
    power: 1.0
    mel_scale: slaney
    norm: slaney
    log_eps: 1.0e-5
