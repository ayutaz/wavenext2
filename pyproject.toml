[project]
name = "wavenext2"
version = "0.0.1"
description = "PyTorch reimplementation of WaveNeXt 2 (arXiv:2605.25506)"
readme = "README.md"
# 3.13.8 は torch 2.11 の JIT overload ソース解析が IndentationError で落ちる既知回帰のため、
# 下限を 3.13.13 (検証で torch import が通る最初のパッチ) に設定。
requires-python = ">=3.13.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "torch>=2.10",
    "torchaudio>=2.10",
    "numpy",
    "scipy",
    "librosa>=0.11.0",
    "soundfile",
    "pyyaml",
    "tensorboard",
    "matplotlib",
    "tqdm",
    "pyworld",
    "einops",
    # MCD: pymcd / mel-cepstral-distance は pysptk 経由で Windows cp313 prebuilt wheel が無いため
    # 採用せず、T-M4.1 で librosa MFCC (c1..c24) + 自前 DTW 実装に確定 (ticket §6.1 最終手段 C、
    # 外部 MCD 依存ゼロ)。絶対値は SPTK mel-cepstrum 系の論文値と系統差あり相対比較主軸 (§8.2)。
    # log-F0 RMSE は pyworld DIO+StoneMask で充足。
]

[project.scripts]
train-gan = "wavenext2.train.train_gan:main"
train-diff = "wavenext2.train.train_diff:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavenext2"]

[tool.uv]
# システム Python (Windows Store 版 / OS 同梱版) を排除し uv 管理版のみ使用。再現性担保。
python-preference = "only-managed"

# PyTorch CUDA wheel index。RTX 40 系 (Ada, sm_89) + driver 596.x は CUDA 13 まで対応。
# 安定性重視で cu128 を採用。driver/GPU 交代時はこの URL を切り替える。
# Apple Silicon (darwin) では index を使わず PyPI 版 (CPU/MPS) を解決する。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
# slow / gpu はデフォルト suite から除外。実行は `uv run pytest -m slow` 等。
addopts = "-m 'not slow and not gpu'"
pythonpath = ["."]  # scripts/ を namespace package として import 可能に (smoke ロジック再利用)
markers = [
    "slow: 長時間テスト (smoke overfit 等)。デフォルト除外",
    "gpu: CUDA 必須テスト。デフォルト除外",
]

[tool.ruff]
target-version = "py313"
line-length = 100
